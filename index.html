<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q4 Practice 2</title>
</head>
<body>
    <h1>Switch Statement</h1>

    <button class="btn btn-info" onclick="teamrank()">Rank</button>

    <script>

        function teamrank(){

var message = "";

        var rank = "1st"

        switch(true){
            case(rank === "1st"):
            message = "Champions!";
            break;

             case(rank === "2nd"):
             message = "2nd Placer!";
            break;

             case(rank === "3rd"):
             message = "3rd Placer!";
            break;

             case(rank === "4th"):
             message = "4th Placer!";
            break;

             default:
             message = "Rank unknown";
            break;
        }

    }

let team = "Yellow"; //string

switch (team){
    case "Yellow":
        alert("Go Yellow Tigers!");
        break;

     case "Blue":
        alert("Go Blue Bears!");
        break;

     case "Green":
        alert("Go Green Hornets!");
        break;

     case "Red":
        alert("Go Red Bulldogs!");
        break;

    default:
        alert("Team could not be determined!);
        break;
        
}
    </script>
</body>
</html>
